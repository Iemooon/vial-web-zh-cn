name: zh-cn Web

# Manual trigger only: pushing to this repo never starts a build.
# Two options at "Run workflow":
#   deploy  - also push the build to the gh-pages branch (publishes the site)
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (gh-pages branch)"
        type: boolean
        default: false

jobs:
  build-web:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    # CPython and Qt5 are compiled from source below, so a mistake here would
    # otherwise only surface after ~45 minutes.  Check the inputs first.
    - name: Check inputs
      run: |
        set -e
        test -f fonts/NotoSansSC-Regular.otf
        test -f src/build.sh
        grep -q 'usr/local/fonts' src/build.sh
        git clone --depth 1 -b zh-cn https://github.com/Iemooon/vial-gui-zh-cn.git vial-gui
        git clone --depth 1 https://github.com/vial-kb/via-keymap-precompiled.git
        test -f vial-gui/src/main/python/i18n/zh_cn.py
        test -f vial-gui/src/main/python/webmain.py
        grep -q 'ensure_cjk_font' vial-gui/src/main/python/i18n/__init__.py
        echo "vial-gui @ $(git -C vial-gui rev-parse HEAD)"
        echo "vial-web @ $(git rev-parse HEAD)"

    - name: Build
      run: |
        set -e
        ./fetch-emsdk.sh
        ./fetch-deps.sh
        ./build-deps.sh
        cd src
        ./build.sh
        # Qt/Python here are built with -pthread, so the page needs a
        # cross-origin-isolated context for SharedArrayBuffer.  GitHub Pages
        # reads this file; any other host must send the same two headers.
        {
          echo '/*'
          echo '  Cross-Origin-Opener-Policy: same-origin'
          echo '  Cross-Origin-Embedder-Policy: require-corp'
        } > build/_headers
        ls -l build
        # The Chinese interface is only usable if the CJK face actually made it
        # into the preloaded filesystem, so verify the artifact instead of
        # assuming: an OTF starts with the bytes OTTO, and the file name is
        # stored in the image's directory table.
        echo "font blobs in .data: $(grep -ac OTTO build/*.data || true)"
        grep -ao 'NotoSansSC[A-Za-z.]*' build/*.data | head -3 || true

    - uses: actions/upload-artifact@v4
      with:
        name: vial-web-zh-cn
        path: src/build

    - name: Deploy to GitHub Pages
      if: ${{ inputs.deploy }}
      run: |
        set -e
        cd src/build
        git init -b gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git add -A
        git commit -m "zh-cn web build (${GITHUB_SHA:0:8})"
        git push --force origin gh-pages:gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
